; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

; The ATmega328P has 2 KB of RAM and the SSD1306 framebuffer claims 1 KB of it
; at runtime, so static allocations are genuinely scarce. The default 64-byte
; serial TX buffer is more than this protocol's short ACK lines ever need;
; halving it buys back heap for that malloc. RX stays at 64 for command bursts.
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=32
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    arduino-libraries/Servo @ ^1.2.1
    adafruit/Adafruit TCS34725 @ ^1.4.4